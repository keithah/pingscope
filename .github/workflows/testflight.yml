name: Build and Upload to TestFlight

on:
  push:
    branches:
      - main

jobs:
  build-and-upload:
    name: Build and Upload to TestFlight
    runs-on: macos-14
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
      
      - name: Build and Archive
        run: |
          xcodebuild archive \
            -scheme PingScope-AppStore \
            -configuration Release \
            -archivePath $RUNNER_TEMP/PingScope.xcarchive \
            -allowProvisioningUpdates
        env:
          DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
      
      - name: Export for App Store
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>6R7S5GA944</string>
              <key>uploadSymbols</key>
              <true/>
              <key>uploadBitcode</key>
              <false/>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF
          
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/PingScope.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -allowProvisioningUpdates
        env:
          DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
      
      - name: Upload to TestFlight
        run: |
          # Create private keys directory
          mkdir -p ~/.private_keys
          
          # Decode and write the API key
          echo "${{ secrets.ASC_PRIVATE_KEY }}" | base64 -d > ~/.private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          
          # Upload to App Store Connect
          xcrun altool --upload-app \
            --type macos \
            --file $RUNNER_TEMP/export/PingScope.pkg \
            --apiKey ${{ secrets.ASC_KEY_ID }} \
            --apiIssuer ${{ secrets.ASC_ISSUER_ID }}
          
          # Clean up
          rm ~/.private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
